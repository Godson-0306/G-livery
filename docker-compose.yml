services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gelivery
      POSTGRES_PASSWORD: gelivery
      POSTGRES_DB: gelivery
    ports:
      - "5433:5432"
    volumes:
      - gelivery_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gelivery -d gelivery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gelivery_pg:
